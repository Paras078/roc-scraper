<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Search</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #16191d; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2f5bea; --hover: #f1f4fe;
    --ok-bg: #e7f6ec; --ok: #18794e; --bad-bg: #fdecec; --bad: #b42318; --mid-bg: #fff4e0; --mid: #a15c07;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a20; --text: #e7e9ee; --muted: #9aa1ad; --line: #2a2f38;
      --accent: #7b9bff; --hover: #1f2430;
      --ok-bg: #12301f; --ok: #5fd49a; --bad-bg: #3a1717; --bad: #ff8a80; --mid-bg: #352711; --mid: #f5b955;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 28px 16px 12px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  #meta { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .bar { display: flex; gap: 8px; }
  #state { padding: 0 12px; font-size: 15px; border: 1px solid var(--line); border-radius: 10px;
           background: var(--panel); color: var(--text); max-width: 40%; }
  #state:focus { outline: none; border-color: var(--accent); }
  #q { flex: 1; min-width: 0; padding: 14px 16px; font-size: 17px; border: 1px solid var(--line);
       border-radius: 10px; background: var(--panel); color: var(--text); outline: none; }
  #q:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 40px;
         display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 16px; align-items: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  #results { list-style: none; margin: 0; padding: 4px; max-height: calc(100vh - 200px); overflow: auto; }
  #results li { padding: 10px 12px; border-radius: 8px; cursor: pointer; }
  #results li:hover, #results li[aria-selected="true"] { background: var(--hover); }
  #results li:focus-visible { outline: 2px solid var(--accent); }
  .name { font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .badge { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--hover); color: var(--muted); }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .badge.mid { background: var(--mid-bg); color: var(--mid); }
  #detail { padding: 22px; position: sticky; top: 16px; }
  #detail h2 { margin: 0 0 6px; font-size: 20px; line-height: 1.3; }
  #detail .cin { font-family: ui-monospace, Menlo, monospace; color: var(--muted); font-size: 13px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 10px 20px; margin: 20px 0 0; }
  dt { color: var(--muted); font-size: 13px; }
  dd { margin: 0; overflow-wrap: anywhere; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  footer { max-width: 1100px; margin: 0 auto; padding: 0 16px 32px; color: var(--muted); font-size: 12px; }
  footer a { color: inherit; }
  #results li.note { cursor: default; color: var(--muted); font-size: 13px; padding: 8px 12px 4px; background: none; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
    #results { max-height: 45vh; }
    #detail { position: static; }
    dl { grid-template-columns: 1fr; gap: 2px; }
    dd { margin-bottom: 10px; }
  }
</style>
</head>
<body>
<header>
  <h1>Company Search</h1>
  <p id="meta">Loading…</p>
  <div class="bar">
    <input id="q" type="search" placeholder="Search by company name or CIN" autocomplete="off" autofocus
           aria-label="Search by company name or CIN">
    <select id="state" aria-label="Filter by state"><option value="">All states</option></select>
  </div>
</header>
<main>
  <div class="card"><ul id="results" role="listbox" aria-label="Results"><li class="empty">Start typing a company name.</li></ul></div>
  <section class="card" id="detail" aria-live="polite"><div class="empty">Select a company to see its details.</div></section>
</main>
<footer>Source: <a href="https://www.data.gov.in/resource/registrars-companies-roc-wise-company-master-data">Registrars of Companies (RoC)-wise Company Master Data</a>, Ministry of Corporate Affairs, via data.gov.in, under the Government Open Data License – India.</footer>
<script>
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const title = s => (s || "").replace(/\b\w/g, c => c.toUpperCase());
const inr = v => v === "" || v == null || isNaN(+v) ? "—" : "₹" + Math.round(+v).toLocaleString("en-IN");
const when = v => v ? new Date(v.replace(" ", "T")).toLocaleString("en-IN", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
const date = v => v ? new Date(v + "T00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "—";
const kind = s => /^active$/i.test(s) ? "ok" : /strike|struck|dissolv|liquidat|amalgamat/i.test(s) ? "bad" : /process|dormant|inactive/i.test(s) ? "mid" : "";
const badge = s => el("span", "badge " + kind(s), s || "Unknown");

fetch("/api/meta").then(r => r.json()).then(m => {
  $("#meta").textContent = `${m.n.toLocaleString("en-IN")} companies · ${m.states.length} states · data refreshed ${m.built}`;
  for (const s of m.states) { const o = el("option", null, title(s)); o.value = s; $("#state").append(o); }
}).catch(() => { $("#meta").textContent = "Data is still loading for the first time. Please check back in a few hours."; });

let timer, seq = 0;
$("#q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(search, 200); });
$("#state").addEventListener("change", search);

async function search() {
  const q = $("#q").value.trim(), my = ++seq, ul = $("#results");
  if (!q) { ul.replaceChildren(el("li", "empty", "Start typing a company name.")); return; }
  const url = "/api/search?" + new URLSearchParams({ q, state: $("#state").value });
  const { results: rows, corrected, too_broad } = await (await fetch(url)).json();
  if (my !== seq) return;  // a newer search already started
  if (too_broad) { ul.replaceChildren(el("li", "empty", "Too many matches. Add another word or pick a state.")); return; }
  if (!rows.length) { ul.replaceChildren(el("li", "empty", "No companies found.")); return; }
  const note = corrected ? [el("li", "note", `Showing results for “${corrected}” first`)] : [];
  ul.replaceChildren(...note, ...rows.map(r => {
    const li = el("li"); li.tabIndex = 0; li.setAttribute("role", "option"); li.dataset.cin = r.CIN;
    const sub = el("div", "sub");
    sub.append(badge(r.CompanyStatus), el("span", null, title(r.CompanyStateCode)), el("span", null, r.CIN),
               el("span", null, "Updated " + date((r.updated_at || "").slice(0, 10))));
    li.append(el("div", "name", r.CompanyName), sub);
    li.onclick = () => show(r.CIN);
    li.onkeydown = e => { if (e.key === "Enter") show(r.CIN); };
    return li;
  }));
}

async function show(cin) {
  location.hash = encodeURIComponent(cin);
  document.querySelectorAll("#results li").forEach(li => li.setAttribute("aria-selected", li.dataset.cin === cin));
  const c = await (await fetch("/api/company?cin=" + encodeURIComponent(cin))).json();
  const d = $("#detail");
  if (!c) { d.replaceChildren(el("div", "empty", "Company not found.")); return; }
  const llp = cin.includes("-");
  const fields = [
    ["Status", badge(c.CompanyStatus)],
    [llp ? "LLPIN" : "CIN", c.CIN],
    ["Type", llp ? "Limited Liability Partnership" : [c.CompanyClass, c.CompanyCategory].filter(Boolean).join(" · ")],
    ["Sub-category", c.CompanySubCategory],
    ["Registered on", date(c.CompanyRegistrationdate_date)],
    ["Registrar", c.CompanyROCcode],
    ["State", title(c.CompanyStateCode)],
    ["Industry", c.CompanyIndustrialClassification],
    ["NIC code", c.nic_code],
    ["Authorised capital", llp ? "" : inr(c.AuthorizedCapital)],
    ["Paid-up capital", llp ? "" : inr(c.PaidupCapital)],
    ["Listing", c.Listingstatus],
    ["Registered office", c.Registered_Office_Address],
    ["Last updated", when(c.updated_at)],   // run that last changed this record
    ["Last checked", when(c.checked_at)],   // run that last fetched it, changed or not
  ];
  const dl = el("dl");
  for (const [k, v] of fields) {
    if (v === "" || v == null || v === "NA") continue;
    const dd = el("dd"); typeof v === "string" ? dd.textContent = v : dd.append(v);
    dl.append(el("dt", null, k), dd);
  }
  d.replaceChildren(el("h2", null, c.CompanyName), el("div", "cin", c.CIN), dl);
}

if (location.hash.length > 1) show(decodeURIComponent(location.hash.slice(1)));
</script>
</body>
</html>
